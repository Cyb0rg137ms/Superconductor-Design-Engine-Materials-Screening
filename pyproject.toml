[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scdesign"
version = "2.0.0"
description = "Validated McMillan/Allen-Dynes T_c formulas and a vectorised mean-field BCS gap solver, with an (explicitly hypothetical) candidate screening demo."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Cyb0rg137ms" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "matplotlib>=3.8"]

[project.scripts]
scdesign = "scdesign.cli:main"

[tool.setuptools.packages.find]
include = ["scdesign*", "materials*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.mypy.overrides]]
module = ["materials.*"]
ignore_errors = true
